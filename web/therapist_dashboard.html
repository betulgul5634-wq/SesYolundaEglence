<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ses Yolunda Eğlence | Terapist Takip ve Klinik Yönetim Paneli</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
    
    /* Yazdırma (PDF Çıktısı) Stilleri */
    @media print {
      body { background-color: #FFFFFF !important; color: #000000 !important; }
      header, .no-print, button, input, select, .action-buttons { display: none !important; }
      .print-only { display: block !important; }
      .shadow-sm, .shadow-md, .shadow-2xl { box-shadow: none !important; border: 1px solid #CBD5E1 !important; }
      .bg-white { background: transparent !important; }
      .print-page-break { page-break-after: always; }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [token, setToken] = useState(localStorage.getItem('therapist_token') || 'demo_token');
      const [isLoggedIn, setIsLoggedIn] = useState(!!localStorage.getItem('therapist_token') || true);
      const [dashboard, setDashboard] = useState(null);
      const [students, setStudents] = useState([]);
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [studentDetail, setStudentDetail] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'students'
      
      // Arama & Filtreleme
      const [searchQuery, setSearchQuery] = useState('');
      const [filterPhoneme, setFilterPhoneme] = useState('ALL');
      
      // Modallar & Formlar
      const [isAddStudentOpen, setIsAddStudentOpen] = useState(false);
      const [shareModalStudent, setShareModalStudent] = useState(null);
      const [isCopied, setIsCopied] = useState(false);
      const [newStudent, setNewStudent] = useState({ full_name: '', age: 6, avatar: '👦', diagnosis: 'Artikülasyon Güçlüğü', target_phonemes: '/r/, /s/' });
      const [clinicalNoteInput, setClinicalNoteInput] = useState('');
      const [isSavingNote, setIsSavingNote] = useState(false);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [lastRefreshedTime, setLastRefreshedTime] = useState(new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));

      // Giriş & Kayıt Formu State
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
      const [loginEmail, setLoginEmail] = useState('terapist@istinye.edu.tr');
      const [loginPass, setLoginPass] = useState('123456');
      const [regFullName, setRegFullName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPass, setRegPass] = useState('');
      const [regClinic, setRegClinic] = useState('İstinye Üniversitesi Dil ve Konuşma Terapisi Kliniği');
      const [regTitle, setRegTitle] = useState('Uzman Dil ve Konuşma Terapisti');
      const [loginError, setLoginError] = useState('');

      const phonemeChartRef = useRef(null);
      const errorChartRef = useRef(null);
      const chartInstances = useRef({});

      const API_BASE = 'http://127.0.0.1:8000';
      const FLUTTER_WEB_BASE = 'http://127.0.0.1:8080';

      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setLoginError('');
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail, password: loginPass })
          });
          if (res.ok) {
            const data = await res.json();
            localStorage.setItem('therapist_token', data.access_token);
            setToken(data.access_token);
            setIsLoggedIn(true);
            fetchDashboard();
            fetchStudents();
          } else {
            setLoginError('E-posta veya şifre hatalı!');
          }
        } catch (err) {
          // Fallback demo giriş
          localStorage.setItem('therapist_token', 'demo_token');
          setToken('demo_token');
          setIsLoggedIn(true);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('therapist_token');
        setToken('');
        setIsLoggedIn(false);
      };

      const handleRegister = async (e) => {
        if (e) e.preventDefault();
        setLoginError('');
        try {
          const res = await fetch(`${API_BASE}/api/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              full_name: regFullName,
              email: regEmail,
              password: regPass,
              clinic_name: regClinic,
              title: regTitle
            })
          });
          if (res.ok) {
            const data = await res.json();
            localStorage.setItem('therapist_token', data.access_token);
            setToken(data.access_token);
            setIsLoggedIn(true);
            fetchDashboard();
            fetchStudents();
          } else {
            const errData = await res.json();
            setLoginError(errData.detail || 'Kayıt oluşturulamadı!');
          }
        } catch (err) {
          setLoginError('Sunucu bağlantı hatası!');
        }
      };

      const fetchDashboard = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/therapist/dashboard`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          setDashboard(data);
        } catch (e) {
          console.error('Dashboard çekme hatası:', e);
        }
      };

      const fetchStudents = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/therapist/students`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          setStudents(data.students || []);
        } catch (e) {
          console.error('Öğrenci listesi hatası:', e);
        }
      };

      const fetchStudentDetail = async (id) => {
        try {
          const res = await fetch(`${API_BASE}/api/therapist/students/${id}`);
          const data = await res.json();
          setStudentDetail(data);
          setSelectedStudent(data.student);
        } catch (e) {
          console.error('Öğrenci detay hatası:', e);
        }
      };

      const handleRefresh = async () => {
        setIsRefreshing(true);
        await Promise.all([fetchDashboard(), fetchStudents()]);
        if (selectedStudent) {
          await fetchStudentDetail(selectedStudent.id);
        }
        setLastRefreshedTime(new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        setTimeout(() => setIsRefreshing(false), 500);
      };

      useEffect(() => {
        if (isLoggedIn) {
          fetchDashboard();
          fetchStudents();
        }
      }, [token, isLoggedIn]);

      // Grafiklerin çizimi
      useEffect(() => {
        if (!dashboard || activeTab !== 'dashboard' || !isLoggedIn) return;

        // 1. Fonem Başarı Grafiği (Bar)
        if (phonemeChartRef.current) {
          if (chartInstances.current.phoneme) chartInstances.current.phoneme.destroy();
          const pLabels = dashboard.phoneme_stats?.map(p => `/${p.phoneme}/ Sesi`) || [];
          const pValues = dashboard.phoneme_stats?.map(p => p.accuracy) || [];
          
          chartInstances.current.phoneme = new Chart(phonemeChartRef.current, {
            type: 'bar',
            data: {
              labels: pLabels.length > 0 ? pLabels : ['/r/ Sesi', '/k/ Sesi', '/s/ Sesi', '/p/ Sesi', '/t/ Sesi'],
              datasets: [{
                label: 'Ortalama Artikülasyon Başarısı (%)',
                data: pValues.length > 0 ? pValues : [78.5, 84.0, 91.2, 72.0, 88.0],
                backgroundColor: '#3B82F6',
                borderRadius: 8,
              }]
            },
            options: {
              responsive: true,
              scales: {
                y: { min: 0, max: 100, grid: { color: '#F1F5F9' } },
                x: { grid: { display: false } }
              },
              plugins: { legend: { display: false } }
            }
          });
        }

        // 2. Hata Türleri Dağılımı (Doughnut)
        if (errorChartRef.current) {
          if (chartInstances.current.error) chartInstances.current.error.destroy();
          const errEntries = Object.entries(dashboard.error_distribution || {});
          
          chartInstances.current.error = new Chart(errorChartRef.current, {
            type: 'doughnut',
            data: {
              labels: errEntries.map(e => e[0]),
              datasets: [{
                data: errEntries.map(e => e[1]),
                backgroundColor: ['#EF4444', '#F59E0B', '#10B981', '#6366F1', '#8B5CF6'],
                borderWidth: 2,
                borderColor: '#FFFFFF'
              }]
            },
            options: {
              responsive: true,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
              }
            }
          });
        }
      }, [dashboard, activeTab, isLoggedIn]);

      const handleAddStudent = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/api/therapist/students`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(newStudent)
          });
          if (res.ok) {
            setIsAddStudentOpen(false);
            setNewStudent({ full_name: '', age: 6, avatar: '👦', diagnosis: 'Artikülasyon Güçlüğü', target_phonemes: '/r/, /s/' });
            fetchStudents();
            fetchDashboard();
          }
        } catch (err) {
          alert('Öğrenci eklenemedi!');
        }
      };

      const handleDeleteStudent = async (e, id, name) => {
        e.stopPropagation();
        if (!confirm(`"${name}" adlı danışanı ve tüm seans geçmişini silmek istediğinize emin misiniz?`)) return;
        try {
          const res = await fetch(`${API_BASE}/api/therapist/students/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            fetchStudents();
            fetchDashboard();
            if (selectedStudent?.id === id) {
              setSelectedStudent(null);
            }
          }
        } catch (err) {
          alert('Silme işlemi başarısız!');
        }
      };

      const handleAddClinicalNote = async (e) => {
        e.preventDefault();
        if (!clinicalNoteInput.trim() || !selectedStudent) return;
        setIsSavingNote(true);
        try {
          const res = await fetch(`${API_BASE}/api/therapist/students/${selectedStudent.id}/notes`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ note: clinicalNoteInput.trim() })
          });
          if (res.ok) {
            setClinicalNoteInput('');
            fetchStudentDetail(selectedStudent.id);
          }
        } catch (err) {
          alert('Not eklenemedi!');
        } finally {
          setIsSavingNote(false);
        }
      };

      const getMagicLink = (std) => {
        if (!std) return FLUTTER_WEB_BASE;
        return `${FLUTTER_WEB_BASE}/?student=${encodeURIComponent(std.full_name)}&id=${std.id}`;
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        setIsCopied(true);
        setTimeout(() => setIsCopied(false), 2500);
      };

      const filteredStudents = students.filter(s => {
        const matchesSearch = s.full_name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.diagnosis?.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesPhoneme = filterPhoneme === 'ALL' || s.target_phonemes?.includes(filterPhoneme);
        return matchesSearch && matchesPhoneme;
      });

      // ── EĞER GİRİŞ YAPILMAMIŞSA: KLİNİK GİRİŞ & KAYIT EKRANI ──────────────
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-gradient-to-tr from-slate-100 via-blue-50 to-indigo-100 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-200">
              <div className="text-center mb-6">
                <div className="w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl shadow-lg shadow-blue-500/30 mb-3">
                  🎙️
                </div>
                <h2 className="text-2xl font-black text-slate-900 tracking-tight">Ses Yolunda Eğlence</h2>
                <p className="text-xs text-blue-700 font-bold mt-1">İstinye Üniversitesi Terapist Portalı</p>
                <p className="text-[11px] text-slate-400 mt-0.5">Uzman Dil ve Konuşma Terapisti Giriş ve Kayıt</p>
              </div>

              {/* Sekme: Giriş Yap vs Terapist Kayıt Ol */}
              <div className="flex bg-slate-100 p-1 rounded-2xl mb-5">
                <button
                  type="button"
                  onClick={() => { setAuthMode('login'); setLoginError(''); }}
                  className={`flex-1 py-2 text-xs font-extrabold rounded-xl transition ${authMode === 'login' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}
                >
                  🔐 Giriş Yap
                </button>
                <button
                  type="button"
                  onClick={() => { setAuthMode('register'); setLoginError(''); }}
                  className={`flex-1 py-2 text-xs font-extrabold rounded-xl transition ${authMode === 'register' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}
                >
                  📝 Terapist Kayıt Ol
                </button>
              </div>

              {loginError && (
                <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs font-bold text-red-700 flex items-center gap-2">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                  {loginError}
                </div>
              )}

              {authMode === 'login' ? (
                // 1. GİRİŞ FORMU
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Kurumsal E-posta</label>
                    <div className="relative">
                      <span className="absolute left-3.5 top-3 text-slate-400 text-sm">
                        <i className="fa-solid fa-envelope"></i>
                      </span>
                      <input
                        type="email"
                        required
                        value={loginEmail}
                        onChange={e => setLoginEmail(e.target.value)}
                        placeholder="terapist@istinye.edu.tr"
                        className="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 transition"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Şifre</label>
                    <div className="relative">
                      <span className="absolute left-3.5 top-3 text-slate-400 text-sm">
                        <i className="fa-solid fa-lock"></i>
                      </span>
                      <input
                        type="password"
                        required
                        value={loginPass}
                        onChange={e => setLoginPass(e.target.value)}
                        placeholder="••••••••"
                        className="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 transition"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold text-sm rounded-xl shadow-md shadow-blue-500/25 transition flex items-center justify-center gap-2 mt-2"
                  >
                    <i className="fa-solid fa-right-to-bracket"></i>
                    Kliniğe Giriş Yap
                  </button>

                  <div className="mt-4 pt-4 border-t border-slate-100 text-center">
                    <button
                      type="button"
                      onClick={() => { setLoginEmail('terapist@istinye.edu.tr'); setLoginPass('123456'); handleLogin(); }}
                      className="text-xs font-bold text-slate-500 hover:text-blue-600 transition flex items-center justify-center gap-1.5 mx-auto"
                    >
                      <i className="fa-solid fa-bolt text-amber-500"></i>
                      Tek Tıkla Demo Giriş (Doç. Dr. Emir)
                    </button>
                  </div>
                </form>
              ) : (
                // 2. YENİ TERAPİST KAYIT FORMU
                <form onSubmit={handleRegister} className="space-y-3.5">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Adınız Soyadınız</label>
                    <input
                      type="text"
                      required
                      value={regFullName}
                      onChange={e => setRegFullName(e.target.value)}
                      placeholder="Örn: Uzm. DKT Merve Kaya"
                      className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 transition"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Klinik / Üniversite Adı</label>
                    <input
                      type="text"
                      required
                      value={regClinic}
                      onChange={e => setRegClinic(e.target.value)}
                      placeholder="Örn: İstinye DKT Kliniği"
                      className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 transition"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Kurumsal E-posta</label>
                    <input
                      type="email"
                      required
                      value={regEmail}
                      onChange={e => setRegEmail(e.target.value)}
                      placeholder="merve@klinik.com"
                      className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 transition"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Şifre Belirleyin</label>
                    <input
                      type="password"
                      required
                      value={regPass}
                      onChange={e => setRegPass(e.target.value)}
                      placeholder="••••••••"
                      className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 transition"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold text-xs rounded-xl shadow-md shadow-emerald-500/25 transition flex items-center justify-center gap-2 mt-2"
                  >
                    <i className="fa-solid fa-user-plus"></i>
                    Terapist Hesabı Oluştur ve Başla
                  </button>
                </form>
              )}

              {/* Çocuk / Danışan için Yönlendirme */}
              <div className="mt-6 pt-4 border-t border-slate-100 text-center">
                <a
                  href={FLUTTER_WEB_BASE}
                  target="_blank"
                  className="text-xs font-extrabold text-indigo-600 hover:text-indigo-800 transition flex items-center justify-center gap-1.5"
                >
                  <i className="fa-solid fa-gamepad"></i>
                  Çocuk / Danışan mısınız? Oyuna Git →
                </a>
              </div>
            </div>
          </div>
        );
      }

      // ── ANA TERAPİST PANELİ ───────────────────────────────────────────────
      return (
        <div className="min-h-screen flex flex-col">
          {/* Üst Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md shadow-blue-500/20">
                  🎙️
                </div>
                <div>
                  <h1 className="text-lg font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                    Ses Yolunda Eğlence
                    <span className="text-xs bg-blue-100 text-blue-700 font-bold px-2.5 py-0.5 rounded-full border border-blue-200">
                      Terapist Paneli (React)
                    </span>
                  </h1>
                  <p className="text-xs text-slate-500">İstinye Üniversitesi Dil ve Konuşma Terapisi Kliniği</p>
                </div>
              </div>

              {/* Kullanıcı Profili ve Canlı Butonlar */}
              <div className="flex items-center space-x-3">
                {/* 🔄 Canlı Yenile Butonu */}
                <button
                  onClick={handleRefresh}
                  className="flex items-center gap-1.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-300 px-3 py-2 rounded-xl transition"
                  title="Veritabanındaki yeni seansları anında çek"
                >
                  <i className={`fa-solid fa-rotate ${isRefreshing ? 'fa-spin text-blue-600' : ''}`}></i>
                  <span className="hidden sm:inline">Canlı Yenile</span>
                </button>

                {/* Çocuk Oyununa Geçiş */}
                <a href={FLUTTER_WEB_BASE} target="_blank" className="hidden sm:flex items-center gap-2 text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3 py-2 rounded-xl transition">
                  <i className="fa-solid fa-gamepad"></i>
                  Çocuk Uygulaması
                </a>

                {/* Profil & Çıkış Yap */}
                <div className="flex items-center gap-2 pl-3 border-l border-slate-200">
                  <div className="w-9 h-9 rounded-full bg-blue-50 border border-blue-200 flex items-center justify-center text-blue-700 font-bold">
                    👨‍⚕️
                  </div>
                  <div className="text-left hidden md:block">
                    <p className="text-xs font-bold text-slate-800 leading-tight">Doç. Dr. Emir Seyyedabbasi</p>
                    <p className="text-[10px] text-slate-400">Danışman Terapist</p>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="ml-2 w-8 h-8 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 flex items-center justify-center transition"
                    title="Güvenli Çıkış Yap"
                  >
                    <i className="fa-solid fa-right-from-bracket text-sm"></i>
                  </button>
                </div>
              </div>
            </div>
          </header>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
            {/* Sekme Menüsü */}
            <div className="flex items-center justify-between mb-8 border-b border-slate-200 pb-4 no-print">
              <div className="flex space-x-2">
                <button
                  onClick={() => { setActiveTab('dashboard'); setSelectedStudent(null); }}
                  className={`px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'text-slate-600 hover:bg-slate-100'}`}

                        className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap ${isCopied ? 'bg-emerald-600 text-white' : 'bg-slate-800 hover:bg-slate-900 text-white'}`}
                      >
                        <i className={`fa-solid ${isCopied ? 'fa-check' : 'fa-copy'}`}></i>
                        {isCopied ? 'Kopyalandı!' : 'Kopyala'}
                      </button>
                    </div>
                  </div>

                  <div className="pt-2">
                    <a
                      href={`https://api.whatsapp.com/send?text=${encodeURIComponent(`Merhaba! Doç. Dr. Emir Seyyedabbasi tarafından Ses Yolunda Eğlence platformunda ${shareModalStudent.full_name} için konuşma terapisi egzersizleri tanımlanmıştır. Çocuğunuzun seanslarına şifresiz ve anında başlamak için lütfen şu bağlantıya tıklayın:\n\n${getMagicLink(shareModalStudent)}`)}`}
                      target="_blank"
                      className="w-full py-3 bg-[#25D366] hover:bg-[#1EBE5D] text-white font-extrabold text-xs rounded-xl transition flex items-center justify-center gap-2 shadow-md shadow-emerald-500/20"
                    >
                      <i className="fa-brands fa-whatsapp text-lg"></i>
                      Veliye WhatsApp ile Gönder
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Yeni Öğrenci Ekle Modal */}
          {isAddStudentOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-bold text-slate-900">➕ Yeni Danışan Çocuk Ekle</h3>
                  <button onClick={() => setIsAddStudentOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <form onSubmit={handleAddStudent} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Çocuğun Adı Soyadı</label>
                    <input
                      type="text"
                      required
                      value={newStudent.full_name}
                      onChange={e => setNewStudent({...newStudent, full_name: e.target.value})}
                      placeholder="Örn: Mehmet Akif"
                      className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Yaş</label>
                      <input
                        type="number"
                        min="3"
                        max="14"
                        value={newStudent.age}
                        onChange={e => setNewStudent({...newStudent, age: parseInt(e.target.value) || 6})}
                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Avatar</label>
                      <select
                        value={newStudent.avatar}
                        onChange={e => setNewStudent({...newStudent, avatar: e.target.value})}
                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500"
                      >
                        <option value="👦">👦 Erkek Çocuk</option>
                        <option value="👧">👧 Kız Çocuk</option>
                        <option value="🦁">🦁 Aslan</option>
                        <option value="🐼">🐼 Panda</option>
                        <option value="🚀">🚀 Roket</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Klinik Tanı</label>
                    <input
                      type="text"
                      value={newStudent.diagnosis}
                      onChange={e => setNewStudent({...newStudent, diagnosis: e.target.value})}
                      placeholder="Örn: /r/ Sesletim Güçlüğü"
                      className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Hedef Fonemler</label>
                    <input
                      type="text"
                      value={newStudent.target_phonemes}
                      onChange={e => setNewStudent({...newStudent, target_phonemes: e.target.value})}
                      placeholder="Örn: /r/, /s/"
                      className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  <div className="flex space-x-3 pt-3">
                    <button
                      type="button"
                      onClick={() => setIsAddStudentOpen(false)}
                      className="flex-1 py-2.5 rounded-xl border border-slate-300 text-sm font-bold text-slate-600 hover:bg-slate-50 transition"
                    >
                      Vazgeç
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold shadow-md shadow-blue-500/20 transition"
                    >
                      Danışanı Kaydet
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
